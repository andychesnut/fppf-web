body{margin:0}
a{color:#15171a}a:hover{color:#000000}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 16px 16px 16px; display: flex; flex-direction: column; gap: 16px; background: #f3f4f6; color: #15171a; font-family: 'Source Sans 3', system-ui, sans-serif">

<div style="height: 42%; background: {{live}}; border-radius: 4px 4px 0 0"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; font-size: 14px; color: #555a61; text-align: center"><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span></div>
</div>

<div style="background: #ffffff; border: 1px solid #e1e3e7; border-radius: 16px; display: flex; flex-direction: column">

<a href="#edit" style="flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid #ffffff; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; color: #ffffff">Change</a>

<script type="text/x-dc" data-dc-script data-props='{"live":{"editor":"color","default":"#2f6bff"},"$preview":{"width":390,"height":844}}'>
